<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Famtree · Archivio di famiglia</title>
    <meta name="description" content="Albero genealogico interattivo: esplora generazioni, legami e storie della famiglia." />
    <meta name="theme-color" content="#f6f2e9" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="Famtree · Archivio di famiglia" />
    <meta property="og:description" content="Albero genealogico interattivo della famiglia." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('famtree-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Per usare Famtree è necessario abilitare JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
